PATCHES_DIR="$PWD"
SRC_DIR="$(dirname "$PWD")/linux"

KERNEL_REF=latest
KERNEL_REPO_MAINLINE=https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
KERNEL_REPO_STABLE=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

CONFIG_ONLY=n
JOBS=auto
CCACHE=y
CCACHE_DIR="$HOME/.cache/ccache"

LTO=full
MARCH=znver2
MTUNE=znver2
KCFLAGS_EXTRA=""
OPTIMIZE=performance

STRIP=y

WIFI_SRC=""
DEPLOY_EFI=y
EFI_DIR=auto
EFI_BACKUP_DIR=/boot/efi-backup
EFI_BACKUP_KEEP=3

SWAP_GB=auto
SWAP_FILE=/var/tmp/ps5-kbuild.swap

ZSWAP=y
ZSWAP_COMPRESSOR=zstd
ZSWAP_SHRINKER=y
ZRAM=y
ZRAM_COMPRESSOR=zstd
LZ4=y
NTSYNC=y

CONFIG_OPS=()

